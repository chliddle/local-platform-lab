name: buildkit check

# Milestone 4, Phase B checkpoint: proves the rootless BuildKit Service in
# the management cluster can actually build and push a real multi-arch
# image via buildx's `remote` driver -- the exact mechanism Phase F will
# later drop into the app repos' ci.yml/release.yml unchanged. Throwaway:
# pushes to a disposable package, only ever run by hand.
on:
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}/buildkit-check

jobs:
  check:
    runs-on: platform-runners
    permissions:
      contents: read
      packages: write
    steps:
      - name: Generate a trivial build context
        run: |
          mkdir -p /tmp/buildkit-check
          printf 'FROM alpine:3.20\nRUN uname -m > /arch.txt\n' > /tmp/buildkit-check/Dockerfile

      - name: Set up Docker Buildx (remote driver -> in-cluster BuildKit)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: /tmp/buildkit-check
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:check
