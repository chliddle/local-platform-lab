name: promote platform infra to prod

# Both dev's and prod's platform infra now track `main` directly -- one
# branch, no drift vector (see platform/argocd/bootstrap-chart/templates/
# root-platform-app.yaml's comment for why this moved off a separate prod
# branch). prod's Applications have no syncPolicy.automated, so this job
# IS prod's promotion gate: on a push to main that touches platform
# infra, it waits for every Application in dev's own argocd namespace to
# be Synced+Healthy (not just the platform ones -- the real question is
# "did this infra change break dev", and an onboarded app silently
# breaking is exactly the kind of thing a platform-components-only health
# check would miss), then triggers a sync on prod's own platform
# Applications (scripts/sync-prod-applications.sh) -- applying content
# that's already on main, not writing new content anywhere.
#
# No pull_request trigger, deliberately -- same reasoning as every other
# workflow in this repo (see ci-manifests.yml): this repo's only
# collaborator is its owner, so there's no path for anyone but the owner
# to run anything here, structurally.
on:
  push:
    branches: [main]
    paths:
      - "platform/gitops-platform-apps/**"
      - "gitops/dev/platform/**"
  workflow_dispatch: {}

jobs:
  promote:
    runs-on: platform-runners
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install kubectl
        run: |
          arch="$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')"
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/v1.29.2/bin/linux/${arch}/kubectl"
          chmod +x /tmp/kubectl
          sudo mv /tmp/kubectl /usr/local/bin/kubectl

      # This runner's own pod lives ON dev now (Milestone 5 redesign -- see
      # CLAUDE.md's GitHub Actions Runners section), so checking dev's own
      # Applications is direct in-cluster access via the pod's own
      # ServiceAccount token -- no remote credential extraction needed.
      # Scoped by Terraform to get/list/watch Applications in the argocd
      # namespace only (see terraform/environments/dev/main.tf's
      # runner_reads_dev_argocd binding).
      #
      # Discovers the app list dynamically (not a fixed set) so an onboarded
      # app silently breaking still blocks prod -- the same reasoning as
      # before this was extracted to scripts/wait-for-argocd-health.sh,
      # which check-app-dev-health.yml also uses, with an explicit fixed
      # list instead (see that script's own comment for why the two
      # workflows make different choices here).
      - name: Wait for every dev Application to be Synced + Healthy
        env:
          SA_TOKEN_PATH: /var/run/secrets/kubernetes.io/serviceaccount/token
          SA_CA_PATH: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        run: |
          app_names=$(kubectl --server=https://kubernetes.default.svc --token="$(cat "$SA_TOKEN_PATH")" --certificate-authority="$SA_CA_PATH" \
            -n argocd get applications -o jsonpath='{.items[*].metadata.name}')
          scripts/wait-for-argocd-health.sh argocd $app_names

      # prod-argocd-reader is the same extracted cross-cluster credential
      # ci-integration.yml already uses to check prod's health remotely
      # (scripts/sync-runner-creds.sh) -- now also granted `patch` on a
      # fixed, named set of prod Applications (platform/rbac/
      # prod-ci-argocd-reader/rbac.yaml), used here to actually trigger
      # their sync. Masked immediately: unlike a GitHub Actions
      # `secrets.*` value, a token read from an in-cluster Secret is NOT
      # automatically redacted from logs.
      - name: Sync prod's platform Applications
        env:
          SA_TOKEN_PATH: /var/run/secrets/kubernetes.io/serviceaccount/token
          SA_CA_PATH: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        run: |
          prod_server=$(kubectl --server=https://kubernetes.default.svc --token="$(cat "$SA_TOKEN_PATH")" --certificate-authority="$SA_CA_PATH" \
            -n arc-runners get secret prod-argocd-reader -o jsonpath='{.data.server}' | base64 -d)
          prod_token=$(kubectl --server=https://kubernetes.default.svc --token="$(cat "$SA_TOKEN_PATH")" --certificate-authority="$SA_CA_PATH" \
            -n arc-runners get secret prod-argocd-reader -o jsonpath='{.data.token}' | base64 -d)
          echo "::add-mask::${prod_token}"
          prod_ca_file=$(mktemp)
          kubectl --server=https://kubernetes.default.svc --token="$(cat "$SA_TOKEN_PATH")" --certificate-authority="$SA_CA_PATH" \
            -n arc-runners get secret prod-argocd-reader -o jsonpath='{.data.ca\.crt}' | base64 -d >"$prod_ca_file"

          scripts/sync-prod-applications.sh "$prod_server" "$prod_token" "$prod_ca_file" \
            root-platform cert-manager-ca ci-argocd-reader gateway-hostname-route
