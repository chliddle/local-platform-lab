name: integration test

# Proves a platform change (Terraform, Argo CD config) doesn't break the
# real bootstrap: runs the actual `terraform apply` against a throwaway
# Kind cluster (real Kind, real Helm-installed Argo CD, the real
# repo-creds credential template) and checks Argo CD itself comes up
# healthy. Not a mock for what it covers.
#
# Deliberately does NOT wait for onboarded apps to sync or smoke-test
# them (it used to -- see git history): Argo CD's automated sync policy
# relies on its own background reconciliation timer, not an immediate
# reaction to fresh git state, and on a cold cluster spun up fresh every
# run that timer can outlast any wait budget this job can reasonably
# afford, even after forcing a hard refresh. That's a cost of the
# throwaway-cluster model specifically, not a real platform bug --
# confirmed live, twice. Full GitOps-sync verification belongs on
# Milestone 3's self-hosted runners testing against the real, already
# warm dev/prod clusters instead, where this timing problem doesn't
# exist in the first place.
on:
  pull_request:
    paths:
      - "terraform/**"
      - "platform/**"
      - "gitops/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "platform/**"
      - "gitops/**"
  workflow_dispatch: {}

jobs:
  integration-test:
    runs-on: ubuntu-latest
    env:
      TF_VAR_github_username: ${{ secrets.CI_GITHUB_USERNAME }}
      TF_VAR_github_token: ${{ secrets.CI_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Bootstrap dev cluster (real terraform apply)
        working-directory: terraform/environments/dev
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Wait for Argo CD
        working-directory: terraform/environments/dev
        run: |
          echo "KUBECONFIG=$(terraform output -raw kubeconfig_path)" >> "$GITHUB_ENV"
          echo "ARGOCD_NS=$(terraform output -raw argocd_namespace)" >> "$GITHUB_ENV"

      - name: Wait for Argo CD server rollout
        run: kubectl -n "$ARGOCD_NS" rollout status deployment/argocd-server --timeout=180s

      - name: Root app-of-apps was created
        run: kubectl -n "$ARGOCD_NS" get application root
