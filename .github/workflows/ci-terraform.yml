name: terraform CI

# No pull_request trigger, deliberately: this project's only collaborator
# is its owner (verified via the collaborators API), so a PR-triggered run
# would only ever come from a stranger's fork -- removing the trigger
# entirely means there's no path for anyone but the owner to run anything
# here, rather than relying on GitHub's fork-PR sandboxing to bound what a
# stranger's run could do.
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch: {}

# No terraform apply here, on purpose: GitHub-hosted runners have no network
# path to a Kind cluster running on a developer's laptop, so cluster
# bootstrap can only ever happen locally via `make bootstrap`. CI validates
# syntax and formatting only.
jobs:
  validate:
    runs-on: ubuntu-latest
    # Least privilege, explicit rather than relying on the repo/org default
    # GITHUB_TOKEN setting: this job only reads and validates, never writes.
    permissions:
      contents: read
    strategy:
      matrix:
        module:
          - terraform/modules/kind-cluster
          - terraform/environments/dev
          - terraform/environments/prod
          - terraform/environments/management
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: terraform fmt
        working-directory: ${{ matrix.module }}
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.module }}
        run: terraform validate
