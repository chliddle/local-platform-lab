name: terraform CI

on:
  pull_request:
    paths:
      - "terraform/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"

# No terraform apply here, on purpose: GitHub-hosted runners have no network
# path to a Kind cluster running on a developer's laptop, so cluster
# bootstrap can only ever happen locally via `make bootstrap`. CI validates
# syntax and formatting only.
jobs:
  validate:
    runs-on: ubuntu-latest
    # Least privilege, explicit rather than relying on the repo/org default
    # GITHUB_TOKEN setting: this job only reads and validates, never writes.
    permissions:
      contents: read
    strategy:
      matrix:
        module:
          - terraform/modules/kind-cluster
          - terraform/environments/dev
          - terraform/environments/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: terraform fmt
        working-directory: ${{ matrix.module }}
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: ${{ matrix.module }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.module }}
        run: terraform validate
