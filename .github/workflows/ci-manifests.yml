name: manifests CI

# No pull_request trigger, deliberately: this project's only collaborator
# is its owner (verified via the collaborators API), so a PR-triggered run
# would only ever come from a stranger's fork -- removing the trigger
# entirely means there's no path for anyone but the owner to run anything
# here, rather than relying on GitHub's fork-PR sandboxing to bound what a
# stranger's run could do.
on:
  push:
    branches: [main]
    paths:
      - "gitops/**"
      - "platform/**"
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    # Least privilege, explicit rather than relying on the repo/org default
    # GITHUB_TOKEN setting: this job only reads and validates, never writes.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No live cluster is available in CI, so kubectl can't discover the
      # Argo CD Application CRD to do a real dry-run. Sanity-check these as
      # plain YAML instead: parses cleanly and has the fields Argo CD
      # requires. Full schema validation only ever happens against the real
      # cluster, via Argo CD itself refusing to sync an invalid Application.
      # (Workload Kustomize overlays -- deploy/base, deploy/overlays/* --
      # now live in each app's own repo and are validated by that repo's
      # own CI, not here.)
      - run: pip install --quiet pyyaml

      - name: Validate Argo CD Application manifests are well-formed YAML
        run: python3 .github/scripts/validate_argocd_apps.py
