name: manifests CI

on:
  pull_request:
    paths:
      - "gitops/**"
      - "platform/**"
  push:
    branches: [main]
    paths:
      - "gitops/**"
      - "platform/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No live cluster is available in CI, so kubectl can't discover the
      # Argo CD Application CRD to do a real dry-run. Sanity-check these as
      # plain YAML instead: parses cleanly and has the fields Argo CD
      # requires. Full schema validation only ever happens against the real
      # cluster, via Argo CD itself refusing to sync an invalid Application.
      # (Workload Kustomize overlays -- deploy/base, deploy/overlays/* --
      # now live in each app's own repo and are validated by that repo's
      # own CI, not here.)
      - run: pip install --quiet pyyaml

      - name: Validate Argo CD Application manifests are well-formed YAML
        run: python3 .github/scripts/validate_argocd_apps.py
