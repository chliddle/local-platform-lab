name: hello-world CI

on:
  pull_request:
    paths:
      - "apps/hello-world/**"
  push:
    branches: [main]
    paths:
      - "apps/hello-world/**"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hello-world

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/hello-world/go.mod

      - name: gofmt
        working-directory: apps/hello-world
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            echo "gofmt found unformatted files"
            exit 1
          fi

      - name: go vet
        working-directory: apps/hello-world
        run: go vet ./...

      - name: go test
        working-directory: apps/hello-world
        run: go test ./...

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch (amd64 + arm64) only on the real artifact (push to main);
      # PR builds just validate the Dockerfile compiles on the runner's
      # native platform, no push.
      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: apps/hello-world
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
            GIT_COMMIT_SHA=${{ github.sha }}

  # Patches the built digest into the dev GitOps overlay and commits it back
  # to main so Argo CD picks it up. Uses only the default GITHUB_TOKEN
  # (never a PAT) and is path-filtered to apps/hello-world/**, so this
  # commit -- which only touches gitops/dev/** -- can never retrigger this
  # workflow. GitHub also does not run workflows off pushes authenticated
  # with the default token, which is a second, independent guard against a
  # commit loop.
  update-gitops:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s 5.4.2
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Set image digest
        working-directory: gitops/dev/hello-world
        run: kustomize edit set image ${{ env.IMAGE }}=${{ env.IMAGE }}@${{ needs.build.outputs.digest }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/dev/hello-world/kustomization.yaml
          if git diff --cached --quiet; then
            echo "no change to gitops overlay, skipping commit"
          else
            git commit -m "chore(gitops): deploy hello-world@${{ github.sha }} to dev"
            git push origin main
          fi
