# The ARC controller: manages the AutoscalingRunnerSet/AutoscalingListener/
# EphemeralRunnerSet/EphemeralRunner CRDs and their Deployments. No GitHub
# credential of its own -- arc-runners.yaml carries the repo-scoped one.
#
# Lives on dev, not a separate management cluster: a 3rd concurrently-
# reconciling Kind cluster repeatedly starved the shared Docker Desktop VM
# badly enough to crash-loop the real control planes on all three clusters
# (confirmed live across several from-scratch bootstraps). dev already
# tests infra/app changes before they reach prod, so it's the natural home
# for the platform's own tooling too -- see CLAUDE.md's GitHub Actions
# Runners section.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Argo CD's inline Application source for an OCI Helm chart wants
    # repoURL WITHOUT the oci:// scheme (unlike Terraform's helm provider,
    # which requires it) plus a separate `chart:` field -- verified live:
    # keeping oci:// made the repo-server query repoURL alone as the full
    # chart path (ignoring `chart:` entirely), a wrong path GHCR 403'd; and
    # dropping `chart:` outright hits Argo CD's own "repoURL and either
    # path or chart are required" validation. This is the shape that
    # actually resolves.
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set-controller
    targetRevision: "0.14.2"
    helm:
      releaseName: arc
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # ARC's CRDs (AutoscalingRunnerSet/AutoscalingListener/
      # EphemeralRunnerSet/EphemeralRunner) have large enough OpenAPI
      # schemas that client-side apply's kubectl.kubernetes.io/
      # last-applied-configuration annotation exceeds Kubernetes'
      # 262144-byte annotation limit -- confirmed live on a from-scratch
      # bootstrap (never hit before because management had never actually
      # been torn down and recreated until this session).
      # ServerSideApply=true alone did NOT fix this (confirmed live --
      # Argo CD's diffing still hit the same annotation limit even with it
      # set); Replace=true is what actually sidesteps it, since a `kubectl
      # replace` never touches that annotation at all. Safe for CRDs
      # specifically -- they're schema definitions with no stateful data a
      # replace could lose.
      #
      # This chart has no crds.enabled-style toggle to opt out of Argo CD
      # managing them the way kube-prometheus-stack.yaml does, so
      # scripts/pre-apply-large-crds.sh pre-applies these CRDs directly
      # before Argo CD ever syncs this Application -- once they already
      # match, Argo CD's own sync sees no real diff to push through the
      # size-limited codepath (see kube-prometheus-stack.yaml's comment
      # for the etcd request-size failure this sidesteps).
      - ServerSideApply=true
      - Replace=true
