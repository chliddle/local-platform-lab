# Plain-manifest directory source -- platform/buildkit/ holds the same
# Deployment/Service/NetworkPolicy Terraform typed directly before this
# migration (Milestone 5, Phase 1), unchanged: same pinned digest, same
# rootless/unconfined security context, same NetworkPolicy restricting
# ingress to the arc-runners namespace only.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: buildkit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chliddle/local-platform-lab.git
    targetRevision: main
    path: platform/buildkit
  destination:
    server: https://kubernetes.default.svc
    namespace: buildkit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
