# Milestone 6: moved out of Terraform (was kubernetes_role_v1.
# runner_reads_argocd_creds + kubernetes_role_binding_v1.
# runner_reads_argocd_creds) -- no secret material, so this is a plain
# GitOps-managed Application. CreateNamespace=true: don't rely on sync
# ordering against arc-runners.yaml's own release to create the
# arc-runners namespace first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-secrets-rbac
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/chliddle/local-platform-lab.git
    targetRevision: main
    path: platform/rbac/dev-arc-runner-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
