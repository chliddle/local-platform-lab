# Installs Istio's own CRDs (VirtualService, DestinationRule, etc.) and
# cluster-wide resources. Sidecar mode (the default) -- CLAUDE.md prefers
# Istio specifically to demonstrate mTLS/workload identity/VirtualService
# vs. Gateway API comparison, which the sidecar model demonstrates most
# directly; ambient mode would be a different demonstration than asked for.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: "1.30.5"
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # istiod patches this webhook's caBundle at runtime (it has to -- the
  # chart renders it empty since the CA cert doesn't exist yet at install
  # time), so it always drifts from the git-rendered manifest. Verified
  # live and confirmed as this exact, well-known Istio+Argo CD pattern,
  # not a real config problem -- ignored rather than fought with selfHeal
  # perpetually overwriting istiod's own runtime-issued CA bundle.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istiod-default-validator
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
