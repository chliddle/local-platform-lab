# Collector for dev only, not prod (see kube-prometheus-stack.yaml's
# comment for why): collects this cluster's own metrics/logs/traces
# (hostMetrics/clusterMetrics/logsCollection presets below) and fans out
# locally, over in-cluster Service DNS, to this same cluster's own
# Prometheus/Loki/Tempo -- no cross-cluster push, no NodePort, no central
# collector on a separate management cluster (that design was tried first
# and dropped too). One collector technology, one local push mechanism,
# replacing Prometheus pull-scrape entirely (no more node-exporter/
# kube-state-metrics).
#
# -contrib image, not core: confirmed live via `otelcol validate` that the
# core image's receiver set doesn't include filelog or k8s_cluster (only
# hostmetrics is in core) -- core is missing exactly what logsCollection
# and clusterMetrics need.
#
# DaemonSet, not Deployment: filelog/hostmetrics read this node's local
# /var/log and /proc -- functionally identical to a 1-replica Deployment on
# this single-node cluster, but semantically the right controller type.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: "0.173.1"
    helm:
      releaseName: otel-collector
      valuesObject:
        mode: daemonset
        fullnameOverride: otel-collector
        image:
          repository: otel/opentelemetry-collector-contrib
        resources:
          requests:
            cpu: 75m
            memory: 160Mi
          # Explicit limit, not just a request -- see kube-prometheus-
          # stack.yaml's comment for why this matters on the shared VM.
          # useGOMEMLIMIT (chart default: true) sets GOMEMLIMIT from this,
          # so the Go runtime actually respects it.
          limits:
            cpu: 200m
            memory: 320Mi
        # Loosened from the chart's defaults (no initial delay, 3-strike/
        # 30s failure window) -- confirmed live that's too tight for this
        # exact preset combination's real startup work: acquiring a
        # coordination.k8s.io Lease for clusterMetrics's leader election,
        # k8s_attributes' informers syncing, and logsCollection's initial
        # scan of /var/log/pods/*/*/*.log on a node already running Istio/
        # cert-manager/MetalLB/Argo CD. Without this, the pod never reaches
        # Ready at all -- kubelet kills it for a failed liveness probe
        # before startup finishes, every single attempt.
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        presets:
          logsCollection:
            enabled: true
          kubernetesAttributes:
            enabled: true
          hostMetrics:
            enabled: true
          clusterMetrics:
            enabled: true
        config:
          # Self-telemetry: chart default scrapes every 10s, needless
          # resolution for this lab's own internal metrics.
          receivers:
            prometheus:
              config:
                scrape_configs:
                  - job_name: opentelemetry-collector
                    scrape_interval: 60s
                    static_configs:
                      - targets: ["${env:MY_POD_IP}:8888"]
          exporters:
            debug: {}
            otlp/tempo:
              endpoint: tempo.monitoring.svc.cluster.local:4317
              tls:
                insecure: true
            # Loki 3.x's and Prometheus 3.x's native OTLP ingestion
            # endpoints -- plain otlphttp, no vendor-specific exporter or
            # remote-write plugin needed.
            otlphttp/loki:
              endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp
              tls:
                insecure: true
            otlphttp/prometheus:
              endpoint: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/otlp
              tls:
                insecure: true
          service:
            pipelines:
              traces:
                exporters:
                  - debug
                  - otlp/tempo
              logs:
                exporters:
                  - debug
                  - otlphttp/loki
              metrics:
                exporters:
                  - debug
                  - otlphttp/prometheus
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
