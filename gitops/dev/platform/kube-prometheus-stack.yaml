# Prometheus + Alertmanager + Grafana, on dev only (CLAUDE.md's stated
# intent for Milestone 7, pulled forward into Milestone 5) -- not a
# separate management cluster (tried first and dropped: a 3rd cluster
# concurrently reconciling alongside dev/prod repeatedly starved the
# shared Docker Desktop VM badly enough to crash-loop the real control
# planes), and NOT duplicated onto prod either (also tried: confirmed live
# the VM's total 7.65GiB genuinely can't hold two full copies of this
# stack plus everything else both clusters already run -- real, sustained
# swap exhaustion and pod crash-loops, not a tunable resource-limit
# problem). This cluster's own OTel Collector (otel-collector.yaml, this
# same directory) fans out locally to this stack -- prod runs no
# equivalent collector or backend, so prod currently has no metrics/logs/
# traces/synthetic-probe coverage at all. Accepted tradeoff for a
# single-laptop lab; a real deployment wouldn't share one
# memory-constrained VM across every cluster it runs.
# kubeStateMetrics/nodeExporter are disabled below because the OTel
# Collector's hostMetrics/clusterMetrics presets replace them.
#
# No storage/PVCs: Prometheus/Alertmanager/Grafana all run on ephemeral
# emptyDir with short retention -- a deliberate lab-scale choice given the
# Docker Desktop VM disk-full incident from Milestone 4 (CLAUDE.md's
# "Lessons Learned"); losing metrics history on a pod restart is an
# acceptable tradeoff here, unbounded disk growth is not.
#
# Grafana's admin password is chart-generated (kubectl get secret -n
# monitoring kube-prometheus-stack-grafana -o jsonpath='{.data.admin-password}'
# | base64 -d) -- same pattern this project already uses for Argo CD's own
# initial admin secret, no new credential-management mechanism needed.
#
# Every component gets an explicit CPU *limit*, not just a request --
# confirmed live this session that requests alone don't help: the shared
# Docker Desktop VM (single pool for all three Kind clusters) hit real CPU
# contention (300%+ per container, host load average >15 on a 14-CPU VM)
# from a handful of components bursting unbounded during their initial
# reconcile, which cascaded into API server timeouts. 60s scrape/evaluation
# interval (chart default is stricter) -- this lab has nothing that needs
# sub-minute metric resolution.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "91.5.0"
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        prometheus:
          prometheusSpec:
            retention: 24h
            scrapeInterval: 60s
            evaluationInterval: 60s
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 250m
                memory: 512Mi
            # Prometheus 3.x's native OTLP metrics receiver -- this
            # cluster's OTel Collector (otel-collector.yaml) pushes here
            # instead of being pull-scraped. NOT an enableFeatures entry:
            # confirmed live (`prometheus --help` inside the running pod)
            # that `--enable-feature=otlp-write-receiver` is stale syntax
            # from an older Prometheus version -- this build just logs
            # "Unknown option for --enable-feature" and silently ignores
            # it, which meant the OTLP endpoint 404'd the whole time and
            # every metric the collector tried to push was silently
            # dropped. The actual flag is the dedicated
            # --web.enable-otlp-receiver, which the Prometheus Operator
            # CRD exposes as this top-level field, confirmed via the
            # installed CRD's schema.
            enableOTLPReceiver: true
        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                cpu: 50m
                memory: 64Mi
        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
        grafana:
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            # 192Mi, then 384Mi, both unstable live (probe timeouts,
            # restarts) -- this chart's Grafana version ships a built-in
            # Kubernetes-style apiserver (dashboard.grafana.app,
            # playlist.grafana.app, alerting.grafana.app, etc., visible in
            # its own startup logs) with real baseline memory overhead
            # beyond older Grafana releases. Confirmed live this session
            # multiple other components (Argo CD's controller, Tempo) also
            # needed more than their previous sizing on this exact
            # from-scratch bootstrap -- being generous here too rather
            # than iterating again.
            limits:
              cpu: 150m
              memory: 512Mi
        # Replaced by the OTel Collector's hostMetrics/clusterMetrics
        # presets (this cluster's own otel-collector.yaml runs them too),
        # pushed via OTLP above instead of scraped.
        kubeStateMetrics:
          enabled: false
        nodeExporter:
          enabled: false
        # CRDs are NOT managed by this Application -- confirmed live these
        # CRDs (prometheuses.monitoring.coreos.com alone is ~850KB) are too
        # large for Argo CD to safely track: applying them here made the
        # application-controller's own status write exceed etcd's request
        # size limit ("etcdserver: request is too large"), which left the
        # sync operation permanently stuck rather than just slow. Applied
        # out-of-band instead, via scripts/pre-apply-large-crds.sh (same
        # reasoning, same fix, as ARC's CRDs -- see arc-controller.yaml).
        crds:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # Same benign CRD drift as cert-manager.yaml (see its comment for the
  # full explanation): kubectl's own last-applied-configuration bookkeeping
  # annotation, plus spec.conversion/spec.versions[].selectableFields --
  # this cluster's pinned Kubernetes v1.29.2 doesn't support
  # selectableFields (a 1.31+ CRD feature), so the API server silently
  # drops it and defaults spec.conversion.strategy to "None" on creation.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - '.metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"]'
        - '.spec.conversion'
        - '.spec.versions[]?.selectableFields'
    # Grafana's chart generates a fresh random admin-password on every
    # render (no adminPassword pinned, no lookup()-based stability guard)
    # -- confirmed live this made the Secret perpetually OutOfSync, and
    # the Deployment along with it (a checksum/secret pod-template
    # annotation ties a rollout to whatever the Secret's content is),
    # causing an unnecessary Grafana restart on every single sync rather
    # than just once at creation. The actual live password is unaffected
    # by ignoring this -- it only stops Argo CD from computing a new
    # desired value it would otherwise try to roll out every cycle.
    - group: ""
      kind: Secret
      name: kube-prometheus-stack-grafana
      jqPathExpressions:
        - '.data["admin-password"]'
