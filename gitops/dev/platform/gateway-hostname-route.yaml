# sync-wave 3: needs the Gateway (gateway-api-examples, wave 2) to already
# exist -- an HTTPRoute's parentRef can't resolve otherwise.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-hostname-route
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/chliddle/local-platform-lab.git
    targetRevision: main
    path: platform/gateway-api/examples-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-api-examples
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
