# Points directly at the upstream gateway-api repo (a git source, not this
# platform repo), pinned to a tag -- avoids vendoring/copying these CRDs
# in, and stays on the "standard" (stable) channel, not "experimental".
# Cluster-scoped CRDs only; destination.namespace is a structurally
# required field but nothing is actually placed in it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.2
    path: config/crd/standard
    directory:
      # Two exclusions, both verified live against this cluster's pinned
      # Kubernetes version (kindest/node:v1.29.2, see
      # terraform/modules/kind-cluster/variables.tf):
      #  - vap_safeupgrades: an optional guard against installing
      #    experimental-channel CRDs on top of standard-channel ones (not
      #    needed for GatewayClass/Gateway/HTTPRoute itself). Hits an Argo
      #    CD sync bug against this Argo CD version ("ValidatingAdmission
      #    Policy... \"\" not found", despite both resources having real
      #    names) -- excluded rather than fought.
      #  - tlsroutes: not used by anything in this plan (only Gateway/
      #    GatewayClass/HTTPRoute/ReferenceGrant are). Its CRD schema uses
      #    the `isIP`/`isCIDR` CEL library functions, only available on
      #    Kubernetes >= 1.31 -- rejected outright by this cluster's 1.29
      #    API server ("undeclared reference to 'isIP'"). Upgrading the
      #    pinned node image for one unused CRD isn't worth the blast
      #    radius across all three clusters.
      exclude: "{gateway.networking.k8s.io_vap_safeupgrades.yaml,gateway.networking.k8s.io_tlsroutes.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-api-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
