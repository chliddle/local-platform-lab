# The ARC controller: manages the AutoscalingRunnerSet/AutoscalingListener/
# EphemeralRunnerSet/EphemeralRunner CRDs and their Deployments. No GitHub
# credential of its own -- arc-runners.yaml carries the repo-scoped one.
# `helm.releaseName: arc` matches the release name this chart was
# originally installed under via Terraform (Milestone 4), so migrating
# ownership from Terraform to Argo CD re-applies the exact same computed
# resource names rather than creating parallel ones.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-controller
  namespace: argocd
spec:
  project: default
  source:
    # Argo CD (v3.5.3, this cluster) resolves an OCI Helm source's tag/digest
    # against `repoURL` alone -- a separate `chart:` field is NOT appended to
    # it here, unlike a registered Repository-prefix setup. Verified live:
    # a repoURL/chart split (matching Terraform's own helm_release fields)
    # made the repo-server query the wrong path (missing the chart-name
    # suffix) and get a 403 from GHCR's token endpoint. The full chart path
    # in repoURL, no separate chart field, is what actually works.
    repoURL: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
    targetRevision: "0.14.2"
    helm:
      releaseName: arc
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
