apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: template-test-1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chliddle/template-test-1.git
    targetRevision: main
    path: deploy/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: template-test-1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
