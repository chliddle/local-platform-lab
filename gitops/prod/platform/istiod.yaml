# sync-wave 1: istio-base's CRDs (wave 0, the default) must exist first --
# istiod's own chart relies on them.
#
# Resource requests trimmed from the chart's default (500m CPU/2048Mi,
# sized for real clusters) to fit three Kind clusters running on one
# laptop -- same reasoning as platform/argocd/values-dev.yaml.
#
# autoscaleEnabled: false -- no metrics-server anywhere in this project, so
# the chart's default HPA can never read CPU metrics; verified live it
# reports FailedGetResourceMetric and drags istiod's health to Degraded
# even though the pod itself is Running/Ready. Autoscaling a single-node
# Kind control plane has no value here anyway.
#
# Istio's Gateway API auto-provisioning (a `Gateway` resource with
# gatewayClassName: istio triggers istiod to deploy a proxy automatically)
# is used instead of a separate istio-ingressgateway Helm release -- see
# platform/gateway-api/examples/gateway.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: "1.30.5"
    helm:
      valuesObject:
        autoscaleEnabled: false
        pilot:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
