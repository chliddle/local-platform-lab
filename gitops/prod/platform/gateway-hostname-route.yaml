# See gitops/dev/platform/gateway-hostname-route.yaml for the sync-wave
# rationale.
# targetRevision: main, no syncPolicy.automated -- see
# platform/argocd/bootstrap-chart/templates/root-platform-app.yaml's
# comment for the single-branch/triggered-sync promotion model this and
# every other prod platform Application now uses instead of a separate
# prod branch.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-hostname-route
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/chliddle/local-platform-lab.git
    targetRevision: main
    path: platform/gateway-api/examples-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-api-examples
