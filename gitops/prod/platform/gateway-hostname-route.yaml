# See gitops/dev/platform/gateway-hostname-route.yaml for the sync-wave
# rationale.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-hostname-route
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/chliddle/local-platform-lab.git
    targetRevision: prod
    path: platform/gateway-api/examples-prod
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-api-examples
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
