# sync-wave 2: needs both gateway-api-crds and istiod (wave 0/1) already
# running -- istiod is what actually reconciles the Gateway resource here
# and auto-provisions its proxy Deployment/Service.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-examples
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/chliddle/local-platform-lab.git
    targetRevision: main
    path: platform/gateway-api/examples
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-api-examples
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
