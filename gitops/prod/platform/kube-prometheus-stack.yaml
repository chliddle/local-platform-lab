# Prod's own copy of gitops/dev/platform/kube-prometheus-stack.yaml, but
# deliberately MINIMAL: Prometheus + its operator only. grafana.enabled
# and alertmanager.enabled are false here -- not just resource-limited,
# removed entirely -- and blackbox-exporter/dashboards were never added
# to this environment at all. This is a scoped metrics backend for the
# canary AnalysisTemplate's own query (platform/rollouts/prod/
# analysistemplate.yaml), not observability parity with dev.
#
# Re-litigated live before adding this, not assumed safe: dev's own
# comment on this file documents that duplicating the FULL stack onto
# prod once caused real, sustained swap exhaustion and control-plane
# crash-loops on the shared 7.65GiB/14-CPU Docker Desktop VM. Checked via
# `docker stats` immediately before this was added: both Kind clusters
# combined were using 5.85GiB of 7.65GiB, leaving ~1.8GiB free. This
# minimal set (Prometheus + operator + the OTel Collector agent in
# otel-collector.yaml, no Grafana/Alertmanager/kube-state-metrics/
# node-exporter) costs 200m CPU/448Mi at requests, 500m CPU/896Mi at
# worst-case limits -- comfortable headroom, unlike the full-stack
# duplication that crashed before. The prior crash was specifically a
# reconcile-storm CPU spike (first-time chart install/CRD registration),
# not steady-state memory pressure -- reusing dev's own already-tuned
# resource values (explicit limits, 60s scrape/eval interval, ephemeral
# storage) directly targets that same failure mode.
#
# No storage/PVCs, same reasoning as dev: ephemeral emptyDir, short
# retention -- losing metrics history on a pod restart is acceptable
# here, unbounded disk growth on this VM is not (Milestone 4's disk-full
# incident).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "91.5.0"
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        prometheus:
          prometheusSpec:
            retention: 24h
            scrapeInterval: 60s
            evaluationInterval: 60s
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 250m
                memory: 512Mi
            # Same OTLP-receiver flag fix as dev -- see that file's
            # comment for why this specific field, not enableFeatures.
            enableOTLPReceiver: true
        # Not added to prod at all -- see this file's own header comment.
        alertmanager:
          enabled: false
        grafana:
          enabled: false
        prometheusOperator:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
        # Same as dev: OTel Collector's hostMetrics/clusterMetrics
        # presets (gitops/prod/platform/otel-collector.yaml) replace these.
        kubeStateMetrics:
          enabled: false
        nodeExporter:
          enabled: false
        # Same as dev -- these CRDs are too large for Argo CD to sync
        # safely (etcd request-size limit); applied out-of-band instead,
        # via scripts/pre-apply-large-crds.sh (extended to run this step
        # for prod too, not just dev).
        crds:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # Same benign CRD drift as dev's copy (and cert-manager.yaml) -- see
  # dev's comment for the full explanation. No Grafana-secret
  # ignoreDifferences entry here: Grafana isn't deployed in this
  # environment at all, so that drift can't occur.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - '.metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"]'
        - '.spec.conversion'
        - '.spec.versions[]?.selectableFields'
