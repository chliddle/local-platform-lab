# Synthetic HTTPS probe against the real
# https://template-test-1.prod.platform.local endpoint -- see
# gitops/dev/platform/blackbox-exporter.yaml for the full rationale
# (per-cluster CA mount, no insecure_skip_verify). Only the hostname/CA
# differ from dev's copy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-blackbox-exporter
    targetRevision: "11.18.0"
    helm:
      releaseName: blackbox-exporter
      valuesObject:
        fullnameOverride: blackbox-exporter
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
        extraSecretMounts:
          - name: target-ca
            mountPath: /etc/blackbox/certs
            secretName: blackbox-target-ca
            readOnly: true
        config:
          modules:
            https:
              prober: http
              timeout: 5s
              http:
                valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
                preferred_ip_protocol: "ip4"
                headers:
                  Host: template-test-1.prod.platform.local
                tls_config:
                  server_name: template-test-1.prod.platform.local
                  ca_file: /etc/blackbox/certs/ca.crt
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
