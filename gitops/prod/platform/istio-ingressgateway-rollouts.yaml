# Mirrors gitops/dev/platform/istio-ingressgateway-rollouts.yaml exactly
# (same chart, version, values, and the same live-confirmed
# istio.io/dataplane-mode label fix that unblocked sidecar injection on
# dev) -- prod's canary conversion needs the identical dedicated proxy for
# the identical reason: a classic VirtualService's `gateways` field can't
# attach to a Gateway API-provisioned proxy, confirmed live on dev, and
# prod's own routing (platform/gateway-api examples) is Gateway API-based
# too. See dev's copy of this file for the full reasoning on every
# individual value below -- unchanged here, not re-derived.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingressgateway-rollouts
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: gateway
    targetRevision: "1.30.5"
    helm:
      releaseName: istio-ingressgateway-rollouts
      valuesObject:
        service:
          type: NodePort
        labels:
          "istio.io/dataplane-mode": ""
        autoscaling:
          enabled: false
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-ingress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
