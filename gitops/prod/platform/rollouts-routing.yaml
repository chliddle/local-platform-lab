# Mirrors gitops/dev/platform/rollouts-routing.yaml: platform-owned
# routing for template-test-1's canary strategy (VirtualService/
# DestinationRule/AnalysisTemplate are platform-repo-owned, wired in when
# onboarding, not app-repo concerns -- same division of responsibility as
# gateway-hostname-route.yaml). sync-wave 3, same reasoning as dev's copy
# and as gateway-hostname-route.yaml: needs istio-ingressgateway-rollouts
# (this same wave) and kube-prometheus-stack (wave 1, like dev's) to
# already exist.
#
# targetRevision: prod, unlike dev's `main` -- matches every other prod
# platform Application (see cert-manager-ca.yaml/gateway-hostname-route.yaml),
# prod's root-platform only ever advances via promote-platform.yml's
# fast-forward gate, never a direct push.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rollouts-routing
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/chliddle/local-platform-lab.git
    targetRevision: prod
    path: platform/rollouts/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: template-test-1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
