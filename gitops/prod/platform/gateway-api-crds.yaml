# Points directly at the upstream gateway-api repo (a git source, not this
# platform repo), pinned to a tag -- avoids vendoring/copying these CRDs
# in, and stays on the "standard" (stable) channel, not "experimental".
# Cluster-scoped CRDs only; destination.namespace is a structurally
# required field but nothing is actually placed in it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.2
    path: config/crd/standard
    directory:
      # Verified live: this ValidatingAdmissionPolicy/-Binding pair (an
      # optional guard against installing experimental-channel CRDs on top
      # of standard-channel ones -- not needed for GatewayClass/Gateway/
      # HTTPRoute itself) hits an Argo CD sync bug against this version
      # ("ValidatingAdmissionPolicy... \"\" not found", despite both
      # resources having real names) -- excluded rather than fought.
      exclude: "gateway.networking.k8s.io_vap_safeupgrades.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-api-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
