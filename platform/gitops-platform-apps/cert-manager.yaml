# crds.enabled: true -- cert-manager moved CRD install to a values flag
# rather than a separate manifest step (the old installCRDs was v1
# terminology, superseded). No ACME/external issuer config here; this
# project uses a purely in-cluster self-signed CA chain (see
# platform/cert-manager/config-{dev,prod}/), so no network egress or
# DNS-01/HTTP-01 solver setup is needed.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: "v1.21.2"
    helm:
      valuesObject:
        crds:
          enabled: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
        webhook:
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
        cainjector:
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # Verified live via a direct diff (live CRD vs a fresh `helm template`
  # render) -- two real causes, both benign:
  #  - metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"]:
  #    kubectl's own client-side-apply bookkeeping, never part of the
  #    Helm-rendered desired state.
  #  - spec.conversion / spec.versions[].selectableFields: this cluster's
  #    pinned Kubernetes v1.29.2 (see terraform/modules/kind-cluster/
  #    variables.tf) doesn't support `selectableFields` (a CRD feature
  #    added in Kubernetes 1.31+) -- the API server silently drops it on
  #    creation, and defaults spec.conversion.strategy to "None" when
  #    omitted, both against Kubernetes' 1.29 CRD API only. Same class of
  #    version gap as Gateway API's tlsroutes CRD in Phase 2, here handled
  #    by ignoring rather than excluding since the rest of these CRDs are
  #    load-bearing (unlike tlsroutes).
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - '.metadata.annotations["kubectl.kubernetes.io/last-applied-configuration"]'
        - '.spec.conversion'
        - '.spec.versions[]?.selectableFields'
