# Installs Istio's own CRDs (VirtualService, DestinationRule, etc.) and
# cluster-wide resources. Sidecar mode (the default) -- CLAUDE.md prefers
# Istio specifically to demonstrate mTLS/workload identity/VirtualService
# vs. Gateway API comparison, which the sidecar model demonstrates most
# directly; ambient mode would be a different demonstration than asked for.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: "1.30.5"
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # istiod patches this webhook's caBundle AND flips failurePolicy
  # Ignore->Fail at runtime once it's confirmed healthy (both render as
  # the chart's safe defaults at install time, before istiod exists to
  # patch them), so both fields always drift from the git-rendered
  # manifest. Verified live (diffed the live object against a fresh `helm
  # template` render) and confirmed as this exact, well-known Istio+Argo CD
  # pattern, not a real config problem -- ignored rather than fought with
  # selfHeal perpetually overwriting istiod's own runtime-managed state.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istiod-default-validator
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
        - '.webhooks[]?.failurePolicy'
