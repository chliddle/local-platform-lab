# MetalLB over cloud-provider-kind: Kind's own docs now lead with
# cloud-provider-kind, but it runs as a privileged process on the host
# outside any cluster -- a worse fit for "everything reproducible from
# Git/Terraform" than MetalLB, which remains the standard, more
# battle-tested community approach and works fine for this lab.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://metallb.github.io/metallb
    chart: metallb
    targetRevision: "0.16.1"
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
