# Tempo single-binary, local filesystem backend -- same "lab-scale, no
# object storage" shape as loki.yaml, deployed identically to dev and prod.
# Not exposed cross-cluster: this same cluster's own OTel Collector
# (otel-collector.yaml) forwards to Tempo over plain in-cluster Service DNS.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: "1.24.4"
    helm:
      releaseName: tempo
      valuesObject:
        tempo:
          retention: 1h
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            # Explicit limit, not just a request -- see kube-prometheus-
            # stack.yaml's comment for why this matters on the shared VM.
            # 192Mi OOMKilled it live (confirmed via dmesg: "Memory cgroup
            # out of memory: Killed process ... (tempo)") once it was
            # actually receiving real trace volume from the OTel Collector
            # rather than sitting idle.
            limits:
              cpu: 100m
              memory: 320Mi
        persistence:
          enabled: true
          size: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
