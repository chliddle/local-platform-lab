# Prod's own copy of platform/rollouts/dev/analysistemplate.yaml -- now
# possible because prod has its own scoped Prometheus
# (gitops/prod/platform/kube-prometheus-stack.yaml: Prometheus + its
# operator only, no Grafana/Alertmanager/kube-state-metrics/node-exporter
# -- verified live it fits the shared Docker Desktop VM's real headroom
# before this was added). Queries the exact metrics/labels
# gitops/prod/platform/otel-collector.yaml scrapes, scoped to just the
# canary ReplicaSet via rollouts_pod_template_hash -- underscored, not
# hyphenated: the OTel Collector's kubernetes_sd_configs labelmap
# sanitizes the pod label's hyphens the same way Prometheus's own
# label-name rules require everywhere else. canary-hash is supplied by
# the Rollout itself (deploy/overlays/prod/rollout.yaml in
# template-test-1: analysis.args, podTemplateHashValue: Latest).
#
# Same timing as dev's (initialDelay 60s, interval 30s, count 3,
# failureLimit 2) -- reused deliberately, not re-derived: dev already
# confirmed live that anything shorter than 2x the OTel Collector's own
# 30s scrape interval returns genuinely empty PromQL results (which Argo
# Rollouts treats as an error, not a zero measurement) before the canary
# pod has had two real scrapes.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: template-test-1-success-rate
  namespace: template-test-1
spec:
  args:
    - name: canary-hash
  metrics:
    - name: success-rate
      initialDelay: 60s
      interval: 30s
      count: 3
      successCondition: result[0] >= 0.95
      failureLimit: 2
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{namespace="template-test-1", rollouts_pod_template_hash="{{args.canary-hash}}", status=~"2.."}[1m]))
            /
            sum(rate(http_requests_total{namespace="template-test-1", rollouts_pod_template_hash="{{args.canary-hash}}"}[1m]))
