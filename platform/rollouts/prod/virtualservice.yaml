# Mirrors platform/rollouts/dev/virtualservice.yaml exactly, scoped to
# prod's own namespace (template-test-1, no -canary suffix -- prod runs
# one deployment strategy, not a comparison sandbox). Argo Rollouts
# manages this VirtualService's http[0].route[] weights live during a
# canary rollout (see deploy/overlays/prod/rollout.yaml in
# template-test-1: trafficRouting.istio.virtualService, name/route name
# must match exactly). The route named "primary" below is the one
# Rollouts recognizes and rewrites. Both destinations must be present
# from the start (canary at weight 0) -- confirmed live on dev: with only
# the stable destination listed, the Rollout itself is rejected.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: template-test-1
  namespace: template-test-1
spec:
  hosts:
    - "*"
  gateways:
    - template-test-1-canary
  http:
    - name: primary
      route:
        - destination:
            host: template-test-1.template-test-1.svc.cluster.local
            subset: stable
            port:
              number: 8080
          weight: 100
        - destination:
            host: template-test-1.template-test-1.svc.cluster.local
            subset: canary
            port:
              number: 8080
          weight: 0
