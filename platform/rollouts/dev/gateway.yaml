# Classic Istio Gateway (networking.istio.io/v1, NOT the Gateway API
# kind) -- selects the dedicated proxy deployed by
# gitops/dev/platform/istio-ingressgateway-rollouts.yaml by its pod
# labels. See that Application's comment for why this needs its own
# proxy rather than reusing demo-gateway's.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: template-test-1-canary
  namespace: template-test-1-canary
spec:
  selector:
    istio: ingressgateway-rollouts
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
