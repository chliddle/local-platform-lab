apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: template-test-1-hostname
  namespace: gateway-api-examples
spec:
  parentRefs:
    - name: demo-gateway
  hostnames:
    - "template-test-1.prod.platform.local"
  rules:
    - backendRefs:
        - name: template-test-1
          namespace: template-test-1
          port: 8080
