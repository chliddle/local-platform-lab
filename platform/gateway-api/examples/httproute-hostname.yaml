# Hostname routing example (CLAUDE.md, Gateway API section). This
# manifest is shared verbatim between dev and prod (same Argo CD source
# path, no per-env templating), so the hostname here is a placeholder --
# curl with an explicit Host header or --resolve to exercise this in
# Phase 2's checkpoint. Phase 3 wires up real per-cluster
# *.{dev,prod}.platform.local DNS names once dnsmasq + cert-manager exist;
# this gets revisited then rather than guessed now.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: template-test-1-hostname
  namespace: gateway-api-examples
spec:
  parentRefs:
    - name: demo-gateway
  hostnames:
    - "demo.platform.local"
  rules:
    - backendRefs:
        - name: template-test-1
          namespace: template-test-1
          port: 8080
