# Path routing example (CLAUDE.md, Gateway API section). Cross-namespace
# backendRef into template-test-1, allowed by referencegrant.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: template-test-1-path
  namespace: gateway-api-examples
spec:
  parentRefs:
    - name: demo-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /template-test-1
      backendRefs:
        - name: template-test-1
          namespace: template-test-1
          port: 8080
