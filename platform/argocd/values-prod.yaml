# Minimal argo/argo-cd chart values for a local, single-node Kind cluster.
# Same shape as values-dev.yaml today -- both clusters run on the same
# laptop, so there's no real "prod-grade sizing" difference yet. Kept as a
# separate file (not shared) because that will stop being true once
# Gateway API/TLS (M3) and real resource tuning apply per-environment.
configs:
  params:
    server.insecure: true
    # Caps concurrent chart renders -- several Applications resyncing at
    # once is what caused the CPU bursts below.
    reposerver.parallelism.limit: "2"

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    # 512Mi OOMKilled the controller live on dev (confirmed via dmesg on
    # the kind node: "Memory cgroup out of memory: Killed process ...
    # argocd-applicat") -- this cluster's Applications now include Istio,
    # cert-manager, MetalLB, Gateway API, and the full observability stack
    # on top of the original Milestone 1-3 scope; building its in-memory
    # watch cache for all of it needs more headroom than the original
    # sizing assumed. Same fix as values-dev.yaml.
    limits:
      cpu: 200m
      memory: 768Mi
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
    periodSeconds: 15
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
    periodSeconds: 15

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    # cpu limit (Milestone 5, Phase 4): confirmed live that an uncapped
    # repo-server can burst to 300%+ CPU rendering a few charts at once and
    # starve the API server on the shared Docker Desktop VM both Kind
    # clusters run on -- risk whenever Istio/cert-manager/Gateway API
    # resync together.
    #
    # memory 256Mi OOMKilled the repo-server live (confirmed via dmesg:
    # "Memory cgroup out of memory: Killed process ... argocd-repo-ser",
    # helm subprocesses killed alongside it) while this cluster briefly ran
    # the full observability stack (kube-prometheus-stack, Loki, Tempo)
    # during Milestone 5's redesign -- that stack was moved to dev-only
    # after confirming live it doesn't fit alongside prod's own workloads
    # on this VM (see gitops/dev/platform/kube-prometheus-stack.yaml's
    # comment), but kept this higher ceiling: it's a ceiling, not a
    # reservation, and Istio/cert-manager/Gateway API alone are still
    # enough charts rendering concurrently to be worth the headroom.
    limits:
      cpu: 500m
      memory: 768Mi
  # Loosened from the chart's defaults (1s timeout, 3-strike/30s failure
  # window) -- confirmed live that's tight enough for a CPU-*limited*
  # repo-server to trip it during a legitimate (not stuck) heavy render,
  # causing a restart that throws away in-progress work and makes the
  # underlying slowness worse, not better. 5s/6-strike/90s window tolerates
  # real transient CPU-throttled slowness without masking an actually-dead
  # process.
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
    periodSeconds: 15
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
    periodSeconds: 15

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
    periodSeconds: 15
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
    periodSeconds: 15

applicationSet:
  enabled: false

notifications:
  enabled: false

dex:
  enabled: false
