# Minimal argo/argo-cd chart values for a local, single-node Kind cluster.
# Same posture as values-dev.yaml/values-prod.yaml: insecure server (plain
# HTTP behind kubectl port-forward) avoids needing a local TLS cert for the
# UI, since this Argo CD instance's job is managing this cluster's own
# platform tooling (ARC, BuildKit, and the Milestone 5 observability
# stack), not fronting a real application.
configs:
  params:
    server.insecure: true
    # Caps concurrent chart renders -- a fresh bootstrap (or this Phase 4
    # rollout) creates several Applications at once, and unbounded
    # parallelism is what OOMKilled the repo-server live (see repoServer's
    # memory limit comment below).
    reposerver.parallelism.limit: "2"

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    # 512Mi OOMKilled the controller live on a from-scratch bootstrap
    # (confirmed via `kubectl describe pod`, Reason: OOMKilled) -- this
    # cluster's Applications now include the full monitoring stack (ARC,
    # BuildKit, kube-prometheus-stack, Loki, Tempo, OTel Collector,
    # blackbox-exporter), and building its in-memory cache of everything
    # it watches during the initial sync needs more headroom than the
    # original Milestone 4 sizing (ARC/BuildKit alone) assumed.
    limits:
      cpu: 200m
      memory: 768Mi
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
    periodSeconds: 15
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
    periodSeconds: 15

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    # Milestone 5, Phase 4: 256Mi OOMKilled the repo-server live, confirmed
    # via `kubectl describe pod` (Reason: OOMKilled) -- rendering several
    # large charts at once (kube-prometheus-stack alone is sizeable) needs
    # real headroom, on top of dev/prod's already-larger Istio/cert-manager
    # charts this cluster doesn't even have. cpu limit added at the same
    # time: no cap on this at all is what let a handful of concurrent
    # `helm template` renders burst to 300%+ CPU on the shared Docker
    # Desktop VM and starve the API server (confirmed live via
    # readiness/liveness probe timeouts across every Argo CD component).
    limits:
      cpu: 500m
      memory: 768Mi
  # Loosened from the chart's defaults (1s timeout, 3-strike/30s failure
  # window) -- confirmed live that's tight enough for a CPU-*limited*
  # repo-server to trip it during a legitimate (not stuck) heavy render,
  # causing a restart that throws away in-progress work and makes the
  # underlying slowness worse, not better. 5s/6-strike/90s window tolerates
  # real transient CPU-throttled slowness without masking an actually-dead
  # process.
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
    periodSeconds: 15
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
    periodSeconds: 15

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
    periodSeconds: 15
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
    periodSeconds: 15

applicationSet:
  enabled: false

notifications:
  enabled: false

dex:
  enabled: false
