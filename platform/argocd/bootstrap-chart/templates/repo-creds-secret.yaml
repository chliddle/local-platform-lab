# A credential TEMPLATE (secret-type: repo-creds), not a single-repo
# secret -- matched by URL PREFIX, so it covers this platform repo AND any
# self-service app-team repo onboarded later (e.g. template-test-1) with
# zero further Terraform/chart changes. This is what makes app onboarding
# genuinely self-service: adding a new app is "commit an Application
# manifest to gitops/*/apps/", never "touch Terraform". All repos are
# private, so this credential is required -- comes from Terraform's
# TF_VAR_github_token only, never committed.
apiVersion: v1
kind: Secret
metadata:
  name: github-repo-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo-creds
type: Opaque
stringData:
  type: git
  url: {{ .Values.githubOrgUrl | quote }}
  username: {{ .Values.githubUsername | quote }}
  password: {{ .Values.githubToken | quote }}
