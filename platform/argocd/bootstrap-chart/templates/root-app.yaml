# Self-service onboarded apps (gitops/{{ .Values.environment }}/apps) --
# unchanged in shape since Milestone 1, now templated instead of two
# near-duplicate static files (root-app.yaml/root-app-prod.yaml, which
# differed only by this path).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.githubRepoUrl | quote }}
    targetRevision: main
    path: gitops/{{ .Values.environment }}/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
