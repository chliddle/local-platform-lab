apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  # Multiple sources, combined into one sync: platform/gitops-platform-apps
  # holds the Application manifests that are byte-identical across every
  # cluster (dev and prod should run the same platform infra); this
  # cluster's own gitops/dev/platform holds only what genuinely can't be
  # shared (metallb-config.yaml's IP range -- dev/prod's MetalLB instances
  # share one Docker network and can't hand out overlapping addresses).
  sources:
    - repoURL: https://github.com/chliddle/local-platform-lab.git
      targetRevision: main
      path: platform/gitops-platform-apps
    - repoURL: https://github.com/chliddle/local-platform-lab.git
      targetRevision: main
      path: gitops/dev/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
