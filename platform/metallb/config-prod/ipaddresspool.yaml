# See platform/metallb/config-dev/ipaddresspool.yaml for the full
# rationale. This is prod's disjoint slice of the same shared subnet, so
# dev's and prod's independent MetalLB instances never hand out the same IP.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: kind-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.18.255.211-172.18.255.221
