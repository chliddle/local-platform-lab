# See platform/cert-manager/config-dev/root-ca.yaml for the full
# rationale. Prod's own root CA -- never shared with dev.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: prod-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: local-platform-prod-root-ca
  secretName: prod-root-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: prod-ca-issuer
spec:
  ca:
    secretName: prod-root-ca-secret
