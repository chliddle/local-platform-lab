repos:
  - repo: https://github.com/gitleaks/gitleaks
    # Pinned to a commit SHA, not a mutable tag -- same reasoning as every
    # GitHub Actions pin in this project (Milestone 3): a tag can be
    # repointed by the maintainer or anyone who compromises their account.
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # v1.30.1
    hooks:
      - id: zizmor
        # Offline only: the online audits need a GitHub API token, which
        # isn't guaranteed to be present (or valid) in every developer's
        # shell -- the CI security-lint job runs the full online set
        # instead, with a real token. Everything offline-checkable
        # (template-injection, dangerous-triggers, unpinned actions, etc.)
        # still runs here.
        args: ["--no-progress", "--no-online-audits"]
