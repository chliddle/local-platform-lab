apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  labels:
    app.kubernetes.io/name: hello-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-world
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-world
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: hello-world
          image: ghcr.io/chliddle/hello-world:placeholder
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: base
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            # distroless's nonroot USER is a symbolic name, not numeric --
            # kubelet can't verify runAsNonRoot against it without an
            # explicit numeric UID here. 65532 is distroless's well-known
            # nonroot UID.
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
